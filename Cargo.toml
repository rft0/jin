[package]
name = "jin"
version = "0.1.0"
edition = "2024"
description = "Fast one-shot AI assistant for shell commands and quick script edits"

[dependencies]
serde_json = "1"
similar = "2"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
